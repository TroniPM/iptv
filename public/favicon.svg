<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- TV frame -->
  <rect x="3" y="10" width="58" height="38" rx="6" fill="#863bff"/>
  <!-- Screen bezel -->
  <rect x="7" y="14" width="50" height="30" rx="3" fill="#1a0a2e"/>
  <!-- Play button -->
  <polygon points="25,22 25,40 44,31" fill="#863bff"/>
  <!-- Antenna left -->
  <line x1="22" y1="10" x2="14" y2="3" stroke="#863bff" stroke-width="3" stroke-linecap="round"/>
  <!-- Antenna right -->
  <line x1="42" y1="10" x2="50" y2="3" stroke="#863bff" stroke-width="3" stroke-linecap="round"/>
  <!-- Stand neck -->
  <rect x="28" y="48" width="8" height="6" rx="1" fill="#863bff"/>
  <!-- Stand base -->
  <rect x="18" y="54" width="28" height="5" rx="2.5" fill="#863bff"/>
</svg>
